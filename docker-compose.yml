version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    restart: always

  web:
    build: .
    container_name: ecommerce_api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env

  celery:
    build: .
    container_name: ecommerce_celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      - redis
    env_file:
      - .env